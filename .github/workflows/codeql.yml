name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '28 11 * * 2'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
      packages: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # CodeQL's database finalize fails hard when a language has no source
      # files ("no source code seen during build"), so detect analyzable code
      # per language and skip analysis when none exists yet.
      - name: Detect analyzable source
        id: detect
        run: |
          case "${{ matrix.language }}" in
            python)
              echo "has_source=${{ hashFiles('**/*.py') != '' }}" >> "$GITHUB_OUTPUT"
              ;;
            javascript-typescript)
              echo "has_source=${{ hashFiles('**/*.js', '**/*.jsx', '**/*.mjs', '**/*.cjs', '**/*.ts', '**/*.tsx') != '' }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "has_source=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Initialize CodeQL
        if: steps.detect.outputs.has_source == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        if: steps.detect.outputs.has_source == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
