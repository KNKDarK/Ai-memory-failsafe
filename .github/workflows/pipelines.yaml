name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend Lint & Test Stage
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend CI (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: ${{ hashFiles('**/requirements.txt', '**/pyproject.toml') != '' && 'pip' || '' }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Code Linting & Formatting Check
        if: hashFiles('backend/**/*.py') != ''
        run: |
          ruff check .
          ruff format --check .

      - name: Run Pytest Suite with Coverage
        if: hashFiles('backend/**/*.py') != ''
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          MEMORY_DATABASE: ":memory:"
        run: |
          pytest -v --cov=backend --cov-report=term-missing

  # ---------------------------------------------------------------------------
  # 2. Frontend Lint & Build Stage
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Next.js/React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ hashFiles('frontend/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: ${{ hashFiles('frontend/package-lock.json') != '' && 'frontend/package-lock.json' || '' }}

      - name: Install Frontend Dependencies
        if: hashFiles('frontend/package-lock.json') != ''
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend Code
        if: hashFiles('frontend/package.json') != ''
        run: |
          cd frontend
          npm run lint

      - name: Build Frontend Application
        if: hashFiles('frontend/package.json') != ''
        run: |
          cd frontend
          npm run build

  # ---------------------------------------------------------------------------
  # 3. Security Analysis (Dependency Audit)
  # ---------------------------------------------------------------------------
  security-audit:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Pip Audit
        if: hashFiles('**/requirements.txt', '**/pyproject.toml') != ''
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt